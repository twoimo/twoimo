<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">TWOIMO profile banner</title>
  <desc id="desc">AI products, computer vision, and full-stack engineering from pixels to production.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="1" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#BAE6FD" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#background)"/>
  <rect width="1200" height="260" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="24" fill="url(#glowLeft)"/>
  <rect width="1200" height="260" rx="24" fill="url(#glowRight)"/>

  <path d="M72 62H310" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M890 198H1128" stroke="#818CF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="72" cy="62" r="6" fill="#38BDF8" filter="url(#softGlow)"/>
  <circle cx="1128" cy="198" r="6" fill="#A5B4FC" filter="url(#softGlow)"/>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="600" y="113" fill="#E0F2FE" font-size="72" font-weight="800" letter-spacing="9">TWOIMO</text>
    <text x="600" y="158" fill="#BAE6FD" font-size="18" font-weight="600" letter-spacing="2.3">AI PRODUCTS · COMPUTER VISION · FULL-STACK ENGINEERING</text>
    <text x="600" y="204" fill="#C7D2FE" font-size="14" font-weight="600" letter-spacing="5">FROM PIXELS TO PRODUCTION</text>
  </g>
</svg>
