<svg xmlns="http://www.w3.org/2000/svg" width="423" height="236" viewBox="0 0 423 236" role="img" aria-labelledby="title desc">
  <title id="title">Tzudong Map featured build — dark theme</title>
  <desc id="desc">A compact GitHub-style project card for Tzudong Map, optimized for GitHub dark mode.</desc>
  <style>
    .card{fill:#0d1117;stroke:#30363d;stroke-width:1}
    .title{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#58a6ff}
    .body{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}
    .label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f6fc}
    .value{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}
    .pill{fill:#161b22;stroke:#30363d;stroke-width:1}
    .pillText{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c9d1d9}
    .link{font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8b949e}
    .divider{stroke:#30363d;stroke-width:1}
  </style>
  <rect class="card" x="0.5" y="0.5" width="422" height="235"/>
  <text class="title" x="18" y="40">Tzudong Map</text>
  <text class="body" x="18" y="67">
    <tspan x="18" dy="0" textLength="387" lengthAdjust="spacing">A map-first restaurant product that turns featured video evidence into</tspan>
    <tspan x="18" dy="19" textLength="387" lengthAdjust="spacing">a searchable restaurant map with discovery, community, admin tools,</tspan>
    <tspan x="18" dy="19" textLength="387" lengthAdjust="spacing">storyboard creation, and a validated evidence-processing pipeline.</tspan>
  </text>
  <text class="label" x="18" y="133">Scope:</text>
  <text class="value" x="65" y="133">Live service · 5 product surfaces · 10-cut AI storyboard</text>

  <rect class="pill" x="18" y="150" rx="4" width="90" height="25"/>
  <text class="pillText" x="63" y="167" text-anchor="middle">TypeScript</text>
  <rect class="pill" x="117" y="150" rx="4" width="80" height="25"/>
  <text class="pillText" x="157" y="167" text-anchor="middle">Next.js</text>
  <rect class="pill" x="206" y="150" rx="4" width="90" height="25"/>
  <text class="pillText" x="251" y="167" text-anchor="middle">Supabase</text>
  <rect class="pill" x="305" y="150" rx="4" width="100" height="25"/>
  <text class="pillText" x="355" y="167" text-anchor="middle">Live app</text>

  <line class="divider" x1="18" y1="190" x2="405" y2="190"/>
  <text class="link" x="18" y="214">github.com/twoimo/tzudong</text>
  <text class="link" x="405" y="214" text-anchor="end">Open repository &#8599;</text>
</svg>
