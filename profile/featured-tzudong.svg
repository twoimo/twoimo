<svg xmlns="http://www.w3.org/2000/svg" width="350" height="285" viewBox="0 0 350 285" role="img" aria-labelledby="title desc">
  <title id="title">Tzudong Map featured build</title>
  <desc id="desc">A responsive GitHub-style project card for Tzudong Map.</desc>
  <style>
    .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .title{font:600 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0969da}
    .body{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .value{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .pill{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
    .pillText{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24292f}
    .link{font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#57606a}
    @media (prefers-color-scheme: dark){
      .card{fill:#0d1117;stroke:#30363d}
      .title{fill:#58a6ff}
      .body,.label,.value{fill:#f0f6fc}
      .pill{fill:#161b22;stroke:#30363d}
      .pillText{fill:#c9d1d9}
      .link{fill:#8b949e}
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="349" height="284"/>
  <text class="title" x="18" y="34">Tzudong Map</text>
  <text class="body" x="18" y="67">
    <tspan x="18" dy="0">A map-first restaurant product for places</tspan>
    <tspan x="18" dy="21">featured in Tzuyang videos, with discovery,</tspan>
    <tspan x="18" dy="21">community, admin, storyboard, and evidence tools.</tspan>
  </text>
  <text class="label" x="18" y="147">Scope:</text>
  <text class="value" x="65" y="147">Live service · 5 surfaces · 10-cut AI storyboard</text>

  <rect class="pill" x="18" y="170" rx="4" width="76" height="27"/>
  <text class="pillText" x="56" y="188" text-anchor="middle">TypeScript</text>
  <rect class="pill" x="102" y="170" rx="4" width="64" height="27"/>
  <text class="pillText" x="134" y="188" text-anchor="middle">Next.js</text>
  <rect class="pill" x="174" y="170" rx="4" width="76" height="27"/>
  <text class="pillText" x="212" y="188" text-anchor="middle">Supabase</text>
  <rect class="pill" x="258" y="170" rx="4" width="74" height="27"/>
  <text class="pillText" x="295" y="188" text-anchor="middle">Live app</text>

  <line x1="18" y1="222" x2="332" y2="222" stroke="#30363d" stroke-opacity="0.45"/>
  <text class="link" x="18" y="251">github.com/twoimo/tzudong</text>
  <text class="link" x="332" y="251" text-anchor="end">Open repository &#8599;</text>
</svg>
