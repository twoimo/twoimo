<svg width="846" height="195" viewBox="0 0 846 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TWOIMO AI coding usage</title>
  <desc id="desc">Local-first AI coding usage card ready for its first sync.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <style>
    .title{font:700 18px 'Segoe UI',Ubuntu,sans-serif;fill:#38BDF8}
    .user{font:600 14px 'Segoe UI',Ubuntu,sans-serif;fill:#94A3B8}
    .hdr{font:700 11px 'Segoe UI',Ubuntu,sans-serif;fill:#64748B;letter-spacing:1.5px}
    .big{font:800 40px 'Segoe UI',Ubuntu,sans-serif;fill:url(#accent)}
    .sub{font:400 13px 'Segoe UI',Ubuntu,sans-serif;fill:#94A3B8}
    .item{font:600 14px 'Segoe UI',Ubuntu,sans-serif;fill:#E2E8F0}
    .foot{font:400 11px 'Segoe UI',Ubuntu,sans-serif;fill:#64748B}
  </style>
  <rect x="0.5" y="0.5" width="845" height="194" rx="10" fill="#020617" stroke="#1E293B"/>
  <text x="30" y="34" class="title">⚡ AI Coding Usage</text>
  <text x="816" y="34" text-anchor="end" class="user">@twoimo</text>
  <text x="816" y="49" text-anchor="end" class="foot">local-first · self-hosted</text>
  <line x1="200" y1="60" x2="200" y2="175" stroke="#1E293B"/>
  <line x1="420" y1="60" x2="420" y2="175" stroke="#1E293B"/>

  <text x="30" y="76" class="hdr">STATUS</text>
  <text x="30" y="133" class="big">READY</text>
  <text x="30" y="158" class="sub">first local sync prepared</text>

  <text x="222" y="76" class="hdr">DETECTED TOOLS</text>
  <text x="222" y="102" class="item">Claude Code · Codex</text>
  <text x="222" y="127" class="item">Gemini CLI · Copilot CLI</text>
  <text x="222" y="152" class="sub">and other ccusage-compatible CLIs</text>

  <text x="440" y="76" class="hdr">PRIVACY &amp; AUTOMATION</text>
  <text x="440" y="104" class="item">Usage logs stay on this device</text>
  <text x="440" y="129" class="item">Daily SVG sync to the profile repo</text>
  <text x="440" y="154" class="sub">No external card service or API key</text>
</svg>
