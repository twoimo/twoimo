<svg width="467" height="195" viewBox="0 0 467 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">YEONWOO CHOI GitHub snapshot</title>
  <desc id="desc">GitHub statistics generated from lightweight REST API requests.</desc>
  <style>
    .header{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#38BDF8}
    .sub{font:400 11px 'Segoe UI',Ubuntu,Sans-Serif;fill:#64748B}
    .label{font:500 13px 'Segoe UI',Ubuntu,Sans-Serif;fill:#94A3B8}
    .value{font:700 15px 'Segoe UI',Ubuntu,Sans-Serif;fill:#E2E8F0}
  </style>
  <rect x="0.5" y="0.5" width="466" height="194" rx="8" fill="#020617" stroke="#1E293B"/>
  <text x="25" y="35" class="header">YEONWOO CHOI's GitHub Snapshot</text>
  <text x="25" y="53" class="sub">REST API · public repositories · no GraphQL aggregation</text>
  <line x1="25" y1="64" x2="442" y2="64" stroke="#1E293B"/>
  <circle cx="25" cy="77" r="4" fill="#818CF8"/>
      <text x="38" y="82" class="label">Public repositories</text>
      <text x="205" y="82" text-anchor="end" class="value">46</text>
<circle cx="245" cy="77" r="4" fill="#818CF8"/>
      <text x="258" y="82" class="label">Original projects</text>
      <text x="442" y="82" text-anchor="end" class="value">4</text>
<circle cx="25" cy="112" r="4" fill="#818CF8"/>
      <text x="38" y="117" class="label">Stars earned</text>
      <text x="205" y="117" text-anchor="end" class="value">3</text>
<circle cx="245" cy="112" r="4" fill="#818CF8"/>
      <text x="258" y="117" class="label">Followers</text>
      <text x="442" y="117" text-anchor="end" class="value">41</text>
<circle cx="25" cy="147" r="4" fill="#818CF8"/>
      <text x="38" y="152" class="label">Repository forks</text>
      <text x="205" y="152" text-anchor="end" class="value">0</text>
<circle cx="245" cy="147" r="4" fill="#818CF8"/>
      <text x="258" y="152" class="label">Active last year</text>
      <text x="442" y="152" text-anchor="end" class="value">2</text>
</svg>
