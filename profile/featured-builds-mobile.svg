<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Featured builds</title>
  <desc id="desc">Tzudong Map and Snapish displayed as two compact stacked GitHub-style project cards.</desc>
  <style>
    .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .title{font:600 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0969da}
    .body{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .value{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .pill{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
    .pillText{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24292f}
    .link{font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#57606a}
    @media (prefers-color-scheme: dark){
      .card{fill:#0d1117;stroke:#30363d}
      .title{fill:#58a6ff}
      .body,.label,.value{fill:#f0f6fc}
      .pill{fill:#161b22;stroke:#30363d}
      .pillText{fill:#c9d1d9}
      .link{fill:#8b949e}
    }
  </style>

  <g transform="translate(0 0)">
    <rect class="card" x="0.5" y="0.5" width="359" height="249"/>
    <text class="title" x="18" y="31">Tzudong Map</text>
    <text class="body" x="18" y="59">
      <tspan x="18" dy="0">A map-first restaurant product for places</tspan>
      <tspan x="18" dy="19">featured in Tzuyang videos, with discovery,</tspan>
      <tspan x="18" dy="19">community, admin, storyboard, and evidence tools.</tspan>
    </text>
    <text class="label" x="18" y="126">Scope:</text>
    <text class="value" x="65" y="126">Live · 5 surfaces · 10-cut AI storyboard</text>

    <rect class="pill" x="18" y="146" rx="4" width="76" height="25"/>
    <text class="pillText" x="56" y="163" text-anchor="middle">TypeScript</text>
    <rect class="pill" x="102" y="146" rx="4" width="64" height="25"/>
    <text class="pillText" x="134" y="163" text-anchor="middle">Next.js</text>
    <rect class="pill" x="174" y="146" rx="4" width="76" height="25"/>
    <text class="pillText" x="212" y="163" text-anchor="middle">Supabase</text>
    <rect class="pill" x="258" y="146" rx="4" width="74" height="25"/>
    <text class="pillText" x="295" y="163" text-anchor="middle">Live app</text>

    <line x1="18" y1="194" x2="342" y2="194" stroke="#30363d" stroke-opacity="0.45"/>
    <text class="link" x="18" y="222">github.com/twoimo/tzudong</text>
    <text class="link" x="342" y="222" text-anchor="end">Open &#8599;</text>
  </g>

  <g transform="translate(0 270)">
    <rect class="card" x="0.5" y="0.5" width="359" height="249"/>
    <text class="title" x="18" y="31">Snapish</text>
    <text class="body" x="18" y="59">
      <tspan x="18" dy="0">A YOLOv11-powered service that recognizes</tspan>
      <tspan x="18" dy="19">17 fish and marine species and explains</tspan>
      <tspan x="18" dy="19">closed-season and minimum-size fishing rules.</tspan>
    </text>
    <text class="label" x="18" y="126">Impact:</text>
    <text class="value" x="68" y="126">17 species · 1,500+ images · 88% mAP50</text>

    <rect class="pill" x="18" y="146" rx="4" width="64" height="25"/>
    <text class="pillText" x="50" y="163" text-anchor="middle">Python</text>
    <rect class="pill" x="90" y="146" rx="4" width="78" height="25"/>
    <text class="pillText" x="129" y="163" text-anchor="middle">YOLOv11</text>
    <rect class="pill" x="176" y="146" rx="4" width="58" height="25"/>
    <text class="pillText" x="205" y="163" text-anchor="middle">Flask</text>
    <rect class="pill" x="242" y="146" rx="4" width="90" height="25"/>
    <text class="pillText" x="287" y="163" text-anchor="middle">Vue.js</text>

    <line x1="18" y1="194" x2="342" y2="194" stroke="#30363d" stroke-opacity="0.45"/>
    <text class="link" x="18" y="222">github.com/SnapishAgent/Snapish</text>
    <text class="link" x="342" y="222" text-anchor="end">Open &#8599;</text>
  </g>
</svg>
