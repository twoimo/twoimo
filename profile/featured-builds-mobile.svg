<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
  <title id="title">Featured builds</title>
  <desc id="desc">Tzudong Map and Snapish displayed as two stacked project cards.</desc>
  <defs>
    <linearGradient id="tzAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="snapAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <style>
    .card{fill:#020617;stroke:#1E293B;stroke-width:2}
    .title{font:700 28px 'Segoe UI',Ubuntu,sans-serif;fill:#E2E8F0}
    .desc{font:400 18px 'Segoe UI',Ubuntu,sans-serif;fill:#CBD5E1}
    .label{font:700 17px 'Segoe UI',Ubuntu,sans-serif;fill:#94A3B8}
    .value{font:600 17px 'Segoe UI',Ubuntu,sans-serif;fill:#E2E8F0}
    .pill{fill:#0F172A;stroke:#334155;stroke-width:1}
    .pillText{font:600 15px 'Segoe UI',Ubuntu,sans-serif;fill:#BAE6FD}
    .link{font:600 14px 'Segoe UI',Ubuntu,sans-serif;fill:#64748B}
  </style>

  <rect x="1" y="1" width="598" height="304" rx="16" class="card"/>
  <rect x="1" y="345" width="598" height="304" rx="16" class="card"/>
  <rect x="1" y="1" width="598" height="7" rx="4" fill="url(#tzAccent)"/>
  <rect x="1" y="345" width="598" height="7" rx="4" fill="url(#snapAccent)"/>

  <text x="29" y="49" class="title">Tzudong Map</text>
  <text x="29" y="84" class="desc">A map-first restaurant product turning mukbang video</text>
  <text x="29" y="109" class="desc">evidence into discovery, community, admin, storyboard,</text>
  <text x="29" y="134" class="desc">and evidence-pipeline workflows.</text>
  <text x="29" y="174" class="label">SCOPE</text>
  <text x="100" y="174" class="value">Live service · 5 surfaces · 10-cut AI storyboard</text>

  <rect x="29" y="199" width="110" height="32" rx="16" class="pill"/>
  <text x="84" y="220" text-anchor="middle" class="pillText">TypeScript</text>
  <rect x="149" y="199" width="91" height="32" rx="16" class="pill"/>
  <text x="195" y="220" text-anchor="middle" class="pillText">Next.js</text>
  <rect x="250" y="199" width="105" height="32" rx="16" class="pill"/>
  <text x="303" y="220" text-anchor="middle" class="pillText">Supabase</text>
  <rect x="365" y="199" width="145" height="32" rx="16" fill="#312E81" stroke="#6366F1"/>
  <text x="438" y="220" text-anchor="middle" class="pillText">tzudong.app</text>
  <text x="29" y="269" class="link">github.com/twoimo/tzudong</text>

  <text x="29" y="393" class="title">Snapish</text>
  <text x="29" y="428" class="desc">A YOLOv11 web service recognizing 17 fish and marine</text>
  <text x="29" y="453" class="desc">species while explaining closed-season and minimum-size</text>
  <text x="29" y="478" class="desc">rules, catch records, and fishing-spot data.</text>
  <text x="29" y="518" class="label">IMPACT</text>
  <text x="109" y="518" class="value">17 species · 1,500+ images · 88% mAP50</text>

  <rect x="29" y="543" width="88" height="32" rx="16" class="pill"/>
  <text x="73" y="564" text-anchor="middle" class="pillText">Python</text>
  <rect x="127" y="543" width="105" height="32" rx="16" class="pill"/>
  <text x="180" y="564" text-anchor="middle" class="pillText">YOLOv11</text>
  <rect x="242" y="543" width="81" height="32" rx="16" class="pill"/>
  <text x="283" y="564" text-anchor="middle" class="pillText">Flask</text>
  <rect x="333" y="543" width="91" height="32" rx="16" class="pill"/>
  <text x="379" y="564" text-anchor="middle" class="pillText">Vue.js</text>
  <text x="29" y="613" class="link">github.com/SnapishAgent/Snapish</text>
</svg>
