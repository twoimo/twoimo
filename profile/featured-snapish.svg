<svg xmlns="http://www.w3.org/2000/svg" width="423" height="236" viewBox="0 0 423 236" role="img" aria-labelledby="title desc">
  <title id="title">Snapish featured build</title>
  <desc id="desc">A compact GitHub-style project card for Snapish.</desc>
  <style>
    .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .title{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0969da}
    .body{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .value{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .pill{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
    .pillText{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24292f}
    .link{font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#57606a}
    @media (prefers-color-scheme: dark){
      .card{fill:#0d1117;stroke:#30363d}
      .title{fill:#58a6ff}
      .body,.label,.value{fill:#f0f6fc}
      .pill{fill:#161b22;stroke:#30363d}
      .pillText{fill:#c9d1d9}
      .link{fill:#8b949e}
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="422" height="235"/>
  <text class="title" x="18" y="40">Snapish</text>
  <text class="body" x="18" y="67">
    <tspan x="18" dy="0">A YOLOv11-powered service that recognizes 17 fish</tspan>
    <tspan x="18" dy="19">and marine species and explains closed-season and</tspan>
    <tspan x="18" dy="19">minimum-size fishing rules.</tspan>
  </text>
  <text class="label" x="18" y="133">Impact:</text>
  <text class="value" x="68" y="133">17 species · 1,500+ images · 88% mAP50</text>

  <rect class="pill" x="18" y="150" rx="4" width="64" height="25"/>
  <text class="pillText" x="50" y="167" text-anchor="middle">Python</text>
  <rect class="pill" x="90" y="150" rx="4" width="78" height="25"/>
  <text class="pillText" x="129" y="167" text-anchor="middle">YOLOv11</text>
  <rect class="pill" x="176" y="150" rx="4" width="58" height="25"/>
  <text class="pillText" x="205" y="167" text-anchor="middle">Flask</text>
  <rect class="pill" x="242" y="150" rx="4" width="90" height="25"/>
  <text class="pillText" x="287" y="167" text-anchor="middle">Vue.js</text>

  <line x1="18" y1="190" x2="405" y2="190" stroke="#30363d" stroke-opacity="0.45"/>
  <text class="link" x="18" y="214">github.com/SnapishAgent/Snapish</text>
  <text class="link" x="405" y="214" text-anchor="end">Open repository &#8599;</text>
</svg>
