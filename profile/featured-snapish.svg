<svg xmlns="http://www.w3.org/2000/svg" width="423" height="236" viewBox="0 0 423 236" role="img" aria-labelledby="title desc">
  <title id="title">Snapish featured build — light theme</title>
  <desc id="desc">A compact GitHub-style project card for Snapish, optimized for GitHub light mode.</desc>
  <style>
    .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .title{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0969da}
    .body{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .value{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}
    .pill{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
    .pillText{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24292f}
    .link{font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#57606a}
    .divider{stroke:#d8dee4;stroke-width:1}
  </style>
  <rect class="card" x="0.5" y="0.5" width="422" height="235"/>
  <text class="title" x="18" y="40">Snapish</text>
  <text class="body" x="18" y="67">
    <tspan x="18" dy="0" textLength="387" lengthAdjust="spacing">A YOLOv11-powered product that recognizes 17 fish and marine species,</tspan>
    <tspan x="18" dy="19" textLength="387" lengthAdjust="spacing">explains closed-season and minimum-size rules, and supports catch logs,</tspan>
    <tspan x="18" dy="19" textLength="387" lengthAdjust="spacing">fishing-spot discovery, and practical regulation guidance in one app.</tspan>
  </text>
  <text class="label" x="18" y="133">Impact:</text>
  <text class="value" x="68" y="133">17 species · 1,500+ training images · 88% mAP50</text>

  <rect class="pill" x="18" y="150" rx="4" width="82" height="25"/>
  <text class="pillText" x="59" y="167" text-anchor="middle">Python</text>
  <rect class="pill" x="109" y="150" rx="4" width="96" height="25"/>
  <text class="pillText" x="157" y="167" text-anchor="middle">YOLOv11</text>
  <rect class="pill" x="214" y="150" rx="4" width="75" height="25"/>
  <text class="pillText" x="251.5" y="167" text-anchor="middle">Flask</text>
  <rect class="pill" x="298" y="150" rx="4" width="107" height="25"/>
  <text class="pillText" x="351.5" y="167" text-anchor="middle">Vue.js</text>

  <line class="divider" x1="18" y1="190" x2="405" y2="190"/>
  <text class="link" x="18" y="214">github.com/SnapishAgent/Snapish</text>
  <text class="link" x="405" y="214" text-anchor="end">Open repository &#8599;</text>
</svg>
